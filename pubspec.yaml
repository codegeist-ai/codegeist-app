name: codegeist_app
description: "Private, local Codegeist model inference for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  llamadart: ^0.8.19
  path_provider: ^2.1.6
  # 2.3.x requires a separate API 35 platform through its JNI implementation.
  path_provider_android: 2.2.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/codegeist-logo-horizontal-light.svg

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
            cpu_profile: compact
          android-x64: [cpu]
