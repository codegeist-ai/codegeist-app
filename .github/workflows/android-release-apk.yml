# android-release-apk.yml - build and publish the current signed Android APK
#
# Inputs:
# - The committed main branch selected through workflow_dispatch.
# - The protected release environment's keystore, passwords, alias, and public
#   certificate fingerprint. No signing value may enter repository files or logs.
#
# Side effects:
# - Builds and verifies the universal ARM64/x86_64 release APK.
# - Publishes codegeist.apk on one versioned GitHub Release and marks it latest
#   so Android users get one stable direct-download URL.
#
# Related files:
# - docs/github-release-apk.md
# - Taskfile.yml
# - docs/tasks/T006_distribute_android_apks_directly.md
name: Android release APK

on:
  workflow_dispatch:

concurrency:
  group: android-release-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        # actions/setup-java v5.7.0
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21.0.12+8
          verify-signature: true

      - name: Set up Flutter 3.47.0
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.0

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Verify source
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Prepare release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ]]; then
            printf '%s\n' 'Missing release environment secret: ANDROID_RELEASE_KEYSTORE_BASE64' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/codegeist-release.jks"
          chmod 0600 "$RUNNER_TEMP/codegeist-release.jks"
          test -s "$RUNNER_TEMP/codegeist-release.jks"

      - name: Build universal release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/codegeist-release.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          required_signing_values=(
            ANDROID_RELEASE_KEYSTORE_PATH
            ANDROID_RELEASE_KEYSTORE_PASSWORD
            ANDROID_RELEASE_KEY_PASSWORD
            ANDROID_RELEASE_KEY_ALIAS
          )
          for name in "${required_signing_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing release environment value: %s\n' "$name" >&2
              exit 1
            fi
          done
          flutter build apk --release --no-pub \
            --target-platform android-arm64,android-x64

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/codegeist-release.jks"

      - name: Verify release APK
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          verification="$(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
              verify --verbose --print-certs "$apk"
          )"
          printf '%s\n' "$verification"

          if [[ -z "${ANDROID_RELEASE_CERT_SHA256:-}" ]]; then
            printf '%s\n' 'Missing release environment variable: ANDROID_RELEASE_CERT_SHA256' >&2
            exit 1
          fi
          if ! grep -qx 'Number of signers: 1' <<< "$verification"; then
            printf '%s\n' 'Release APK must have exactly one signer' >&2
            exit 1
          fi
          certificate_line="$(
            grep -m1 '^Signer #1 certificate SHA-256 digest: ' <<< "$verification"
          )"
          actual_fingerprint="${certificate_line##*: }"
          actual_fingerprint="${actual_fingerprint//:/}"
          actual_fingerprint="${actual_fingerprint// /}"
          actual_fingerprint="${actual_fingerprint,,}"
          expected_fingerprint="${ANDROID_RELEASE_CERT_SHA256//:/}"
          expected_fingerprint="${expected_fingerprint// /}"
          expected_fingerprint="${expected_fingerprint,,}"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            printf 'Unexpected release certificate: expected=%s actual=%s\n' \
              "$expected_fingerprint" "$actual_fingerprint" >&2
            exit 1
          fi

          badging="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk")"
          package_line="$(grep -m1 '^package:' <<< "$badging")"
          version_line="$(grep -m1 '^version:' pubspec.yaml)"
          version="${version_line#version: }"
          if [[ ! "$version" =~ ^(.+)\+([0-9]+)$ ]]; then
            printf 'Invalid Flutter release version: %s\n' "$version" >&2
            exit 1
          fi
          expected_version_name="${BASH_REMATCH[1]}"
          expected_version_code="${BASH_REMATCH[2]}"
          if [[ "$package_line" != *"name='ai.codegeist.app'"* ]]; then
            printf '%s\n' 'Release APK has an unexpected package identity' >&2
            exit 1
          fi
          if [[ "$package_line" != *"versionCode='${expected_version_code}'"* ]]; then
            printf 'Release APK versionCode does not match pubspec: expected=%s\n' \
              "$expected_version_code" >&2
            exit 1
          fi
          if [[ "$package_line" != *"versionName='${expected_version_name}'"* ]]; then
            printf 'Release APK versionName does not match pubspec: expected=%s\n' \
              "$expected_version_name" >&2
            exit 1
          fi
          if ! grep -q "^sdkVersion:'33'$" <<< "$badging"; then
            printf '%s\n' 'Release APK must require Android 13 (API 33)' >&2
            exit 1
          fi
          archive_listing="$(unzip -Z1 "$apk")"
          if ! grep -q '^lib/arm64-v8a/' <<< "$archive_listing"; then
            printf '%s\n' 'Missing required arm64-v8a payload in release APK' >&2
            exit 1
          fi
          if ! grep -q '^lib/x86_64/' <<< "$archive_listing"; then
            printf '%s\n' 'Missing required x86_64 payload in release APK' >&2
            exit 1
          fi
          if grep -q '^lib/armeabi-v7a/' <<< "$archive_listing"; then
            printf '%s\n' 'Unexpected armeabi-v7a payload in release APK' >&2
            exit 1
          fi
          if grep -qi '\.gguf$' <<< "$archive_listing"; then
            printf '%s\n' 'Model weights must not be packaged in the release APK' >&2
            exit 1
          fi
          if grep -Eqi '\.(jks|keystore)$' <<< "$archive_listing"; then
            printf '%s\n' 'Signing material must not be packaged in the release APK' >&2
            exit 1
          fi
          sha256sum "$apk"

      - name: Stage release payload
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/release-payload"
          mkdir -p "$payload"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$payload/codegeist.apk"
          version_line="$(grep -m1 '^version:' pubspec.yaml)"
          printf '%s' "${version_line#version: }" > "$payload/version.txt"

      - name: Transfer verified release payload
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codegeist-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-payload
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Publish current release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/release-payload"
          gh run download "$GITHUB_RUN_ID" \
            --name "codegeist-release-${GITHUB_RUN_ID}" \
            --dir "$payload"

          asset="$payload/codegeist.apk"
          version="$(< "$payload/version.txt")"
          if [[ ! "$version" =~ \+([0-9]+)$ ]]; then
            printf 'Invalid Flutter release version: %s\n' "$version" >&2
            exit 1
          fi
          version_code="${BASH_REMATCH[1]}"
          tag="v${version}"
          digest="$(sha256sum "$asset" | cut -d ' ' -f 1)"
          notes="Codegeist ${version} from commit ${GITHUB_SHA}. SHA-256: ${digest}. Requires Android 13 or newer."

          previous_tags="$(
            gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )"
          maximum_version_code=-1
          while IFS= read -r previous_tag; do
            if [[ -z "$previous_tag" ]]; then
              continue
            fi
            if [[ ! "$previous_tag" =~ ^v.*\+([0-9]+)$ ]]; then
              printf 'Existing Release has an unsupported tag: %s\n' \
                "$previous_tag" >&2
              exit 1
            fi
            previous_version_code="${BASH_REMATCH[1]}"
            if (( previous_version_code > maximum_version_code )); then
              maximum_version_code="$previous_version_code"
            fi
          done <<< "$previous_tags"
          if (( version_code <= maximum_version_code )); then
            printf 'Release versionCode must increase: maximum=%s current=%s\n' \
              "$maximum_version_code" "$version_code" >&2
            exit 1
          fi

          all_release_tags="$(
            gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
              --jq '.[].tag_name'
          )"
          if grep -Fxq "$tag" <<< "$all_release_tags"; then
            printf 'Release or draft already exists for tag: %s\n' "$tag" >&2
            exit 1
          fi
          matching_refs="$(
            gh api "repos/${GH_REPO}/git/matching-refs/tags/${tag}" \
              --jq '.[].ref'
          )"
          if grep -Fxq "refs/tags/${tag}" <<< "$matching_refs"; then
            printf 'Release tag already exists: %s\n' "$tag" >&2
            exit 1
          fi

          draft_created=false
          cleanup_draft() {
            if [[ "$draft_created" == true ]]; then
              gh release delete "$tag" --cleanup-tag --yes \
                >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft EXIT

          draft_created=true
          gh release create "$tag" "$asset" \
            --target "$GITHUB_SHA" \
            --title "Codegeist ${version}" \
            --notes "$notes" \
            --draft

          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != true ]]; then
            printf '%s\n' 'Release must remain a draft during verification' >&2
            exit 1
          fi
          if [[ "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" != false ]]; then
            printf '%s\n' 'Release draft must not be a prerelease' >&2
            exit 1
          fi
          asset_names="$(
            gh release view "$tag" --json assets \
              --jq '[.assets[].name] | join(",")'
          )"
          if [[ "$asset_names" != codegeist.apk ]]; then
            printf 'Release draft has unexpected binary assets: %s\n' \
              "$asset_names" >&2
            exit 1
          fi
          draft_target="$(
            gh release view "$tag" --json targetCommitish \
              --jq '.targetCommitish'
          )"
          if [[ "$draft_target" != "$GITHUB_SHA" ]]; then
            printf 'Release draft target mismatch: expected=%s actual=%s\n' \
              "$GITHUB_SHA" "$draft_target" >&2
            exit 1
          fi
          draft_download="$RUNNER_TEMP/draft-download"
          mkdir -p "$draft_download"
          gh release download "$tag" \
            --pattern codegeist.apk \
            --dir "$draft_download"
          draft_digest="$(
            sha256sum "$draft_download/codegeist.apk" | cut -d ' ' -f 1
          )"
          if [[ "$draft_digest" != "$digest" ]]; then
            printf 'Release draft APK digest mismatch: expected=%s actual=%s\n' \
              "$digest" "$draft_digest" >&2
            exit 1
          fi

          gh release edit "$tag" --draft=false --latest
          draft_created=false
          trap - EXIT

          is_immutable="$(
            gh release view "$tag" --json isImmutable --jq '.isImmutable'
          )"
          if [[ "$is_immutable" != true ]]; then
            if ! gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1; then
              printf '%s\n' 'Failed to remove mutable Release after policy check' >&2
            fi
            printf '%s\n' 'Repository must enforce immutable Releases' >&2
            exit 1
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != false ]]; then
            printf '%s\n' 'Published Release must not be a draft' >&2
            exit 1
          fi
          if [[ "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" != false ]]; then
            printf '%s\n' 'Published Release must not be a prerelease' >&2
            exit 1
          fi
          published_asset_names="$(
            gh release view "$tag" --json assets \
              --jq '[.assets[].name] | join(",")'
          )"
          if [[ "$published_asset_names" != codegeist.apk ]]; then
            printf 'Published Release has unexpected binary assets: %s\n' \
              "$published_asset_names" >&2
            exit 1
          fi
          latest_tag="$(gh release view --json tagName --jq '.tagName')"
          if [[ "$latest_tag" != "$tag" ]]; then
            printf 'Latest Release mismatch: expected=%s actual=%s\n' \
              "$tag" "$latest_tag" >&2
            exit 1
          fi

          published="$RUNNER_TEMP/published"
          mkdir -p "$published"
          release_url="https://github.com/${GH_REPO}/releases/latest/download/codegeist.apk"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$published/codegeist.apk" \
            "$release_url"
          published_digest="$(
            sha256sum "$published/codegeist.apk" | cut -d ' ' -f 1
          )"
          if [[ "$published_digest" != "$digest" ]]; then
            printf 'Published APK digest mismatch: expected=%s actual=%s\n' \
              "$digest" "$published_digest" >&2
            exit 1
          fi
          published_tag_sha="$(
            gh api "repos/${GH_REPO}/git/ref/tags/${tag}" \
              --jq '.object.sha'
          )"
          if [[ "$published_tag_sha" != "$GITHUB_SHA" ]]; then
            printf 'Published Release tag mismatch: expected=%s actual=%s\n' \
              "$GITHUB_SHA" "$published_tag_sha" >&2
            exit 1
          fi

          printf 'release_url=%s\n' "$release_url"
